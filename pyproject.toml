[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agent-kenzo"
version = "0.1.0"
description = "Kenzo: a local, repository-aware AI coding agent."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Kenzo Contributors" }]
dependencies = [
    "typer>=0.12.3",
    "rich>=13.7.1",
    "langgraph>=0.2.20",
    "langchain-core>=0.2.38",
    "litellm>=1.44.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "gitpython>=3.1.43",
    "pathspec>=0.12.1",
    # Phase 4 code intelligence: pinned to a mutually ABI-compatible set,
    # verified working on this project's target platform -- the language
    # packages' newest releases build against a newer Language ABI than
    # tree-sitter==0.23.2 supports (raises "Incompatible Language version"),
    # so do not casually bump these independently.
    "tree-sitter==0.23.2",
    "tree-sitter-java==0.23.5",
    "tree-sitter-python==0.23.6",
    "tree-sitter-javascript==0.23.1",
    "tree-sitter-typescript==0.23.2",
    # Phase 5 semantic memory: qdrant-client's embedded ":memory:" mode needs
    # no external server -- verified working fully offline, which is what
    # makes it usable as kenzo's default local vector store (and in tests).
    "qdrant-client>=1.9,<2.0",
    "numpy>=1.26",
    # Phase 6 MCP integration: the official async MCP Python SDK. Verified
    # working end-to-end (stdio transport, real subprocess, list_tools/
    # call_tool) against a real fake server before any kenzo.mcp code was
    # written -- see kenzo/mcp/connection.py's module docstring for the
    # sync-over-async bridge this enables.
    "mcp>=1.0",
    # Phase 7 IDE integration: the local agent server (`kenzo server`) that
    # the VS Code extension connects to over a WebSocket. uvicorn/websockets
    # were already transitive deps of `mcp`; fastapi is the one genuinely
    # new direct dependency this phase adds.
    "fastapi>=0.110",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-mock>=3.14.0",
    "httpx>=0.27",
]

[project.scripts]
kenzo = "kenzo.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["kenzo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
